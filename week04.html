<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>架空オンラインショップ 商品一覧ページ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

<header class="pb-6">
    <h1 class="text-2xl font-bold mb-6 text-center">商品一覧</h1>
    <div class="flex w-32 justify-end hover:scale-105 hover:opacity-80 transition">
        <div class="text-4xl">🛒</div>
        <p class="text-sm text-gray-600">お買い物カゴ</p>
    </div>
</header>
<main>
    <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg hover:opacity-80 transition">
            <div class="text-4xl mb-2 text-center">👗</div>
            <h2 class="font-bold">ニットワンピース</h2>
            <p class="text-gray-500 text-sm mt-1">¥16,600</p>
        </div>
        <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg hover:opacity-80 transition">
            <div class="text-4xl mb-2 text-center">🧥</div>
            <h2 class="font-bold">カーディガン</h2>
            <p class="text-gray-500 text-sm mt-1">¥5,500</p>
        </div>
        <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg hover:opacity-80 transition">
            <div class="text-4xl mb-2 text-center">🥻</div>
            <h2 class="font-bold">フリルロングスカート</h2>
            <p class="text-gray-500 text-sm mt-1">¥8,800</p>
        </div>
        <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg hover:opacity-80 transition">
            <div class="text-4xl mb-2 text-center">👕</div>
            <h2 class="font-bold">レイヤードニット</h2>
            <p class="text-gray-500 text-sm mt-1">¥6,600</p>
        </div>
        <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg hover:opacity-80 transition">
            <div class="text-4xl mb-2 text-center">👖</div>
            <h2 class="font-bold">デニムワイドパンツ</h2>
            <p class="text-gray-500 text-sm mt-1">¥11,000</p>
        </div>
        <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg hover:opacity-80 transition">
            <div class="text-4xl mb-2 text-center">👝</div>
            <h2 class="font-bold">ロゴ入りポーチ</h2>
            <p class="text-gray-500 text-sm mt-1">¥4,400</p>
        </div>
        <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg hover:opacity-80 transition">
            <div class="text-4xl mb-2 text-center">🧢</div>
            <h2 class="font-bold">ロゴ入りキャップ</h2>
            <p class="text-gray-500 text-sm mt-1">¥5,500</p>
        </div>
        <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg hover:opacity-80 transition">
            <div class="text-4xl mb-2 text-center">🕶️</div>
            <h2 class="font-bold">サングラス</h2>
            <p class="text-gray-500 text-sm mt-1">¥2,200</p>
        </div>
    </div>
</main>
</body>
</html>
