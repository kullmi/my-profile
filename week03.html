<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mrs.GREEN APPLEメンバー紹介ページ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-lime-400 max-w-4xl mx-auto px-4 mt-16">

    <header class="fixed top-0 left-0 w-full z-50">
            <h1 class="text-3xl font-bold text-white mb-6 text-center">Mrs.GREEN APPLE　メンバー紹介</h1>
    </header>
    <main>
        <div class="flex justify-between flex-col md:flex-row gap-6">

            <div class="bg-white rounded-lg shadow-md p-6 flex flex-col items-center">
                <img class="rounded-full" src="img\img folder\omori motoki.jpg" alt="大森元貴の写真">
                <h2 class="text-lg font-bold text-gray-900 mt-3">大森元貴</h2>
                <p class="text-gray-600 text-sm mt-2 text-center">Vocal/Guitar</p>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6 flex flex-col items-center">
                <img class="rounded-full" src="img\img folder\wakai hiloto.jpg" alt="若井滉斗の写真">
                <h2 class="text-lg font-bold text-gray-900 mt-3">若井滉斗</h2>
                <p class="text-gray-600 text-sm mt-2 text-center">Guitar</p>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6 flex flex-col items-center">
                <img class="rounded-full" src="img\img folder\fujisawa ryoka.jpg" alt="藤澤涼架の写真">
                <h2 class="text-lg font-bold text-gray-900 mt-3">藤澤涼架</h2>
                <p class="text-gray-600 text-sm mt-2 text-center">Keyboard</p>
            </div>

        </div>
    </main>
</body>
</html>
