<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>まちのごはん屋さん</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-50">

    <!-- ヘッダー -->
    <header class="fixed top-0 left-0 z-50 w-full bg-white shadow px-6 py-4">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-2">
            <h1 class="text-xl font-bold text-sky-900">まちのごはん屋さん</h1>
            <nav class="flex flex-col text-end md:flex-row gap-2 md:gap-6 text-sm">
                <a href="#" class="text-gray-700 hover:text-sky-900">ホーム</a>
                <a href="#" class="text-gray-700 hover:text-sky-900">活動内容</a>
                <a href="#" class="text-gray-700 hover:text-sky-900">お問い合わせ</a>
            </nav>
        </div>
    </header>

    <!-- メイン -->
    <main class="max-w-4xl mx-auto px-6 py-10">

      <!-- ヒーローエリア -->
      <section class="mt-32 mb-10 text-center">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">みんなで食べれば、もっとおいしい。</h2>
        <p class="text-gray-600">子どもたちからおじいちゃんおばあちゃんまで。私たちは地域の幅広い世代に温かいご飯と「誰かと一緒に食べる場所」を提供しています。</p>
      </section>

      <!-- 活動内容カード -->
      <section class="mb-10">
        <h2 class="text-xl font-bold mb-4">活動内容</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg transition">
            <p class="text-2xl mb-2">🍚</p>
            <h3 class="font-bold">毎日の夜ご飯</h3>
            <p class="text-gray-500 text-sm mt-1">毎日18：00～夜ごはんを用意して待っています。</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg transition">
            <p class="text-2xl mb-2">🍜</p>
            <h3 class="font-bold">土日の昼ご飯</h3>
            <p class="text-gray-500 text-sm mt-1">12：00～14：00の間に来てください。</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg transition">
            <p class="text-2xl mb-2">🎂</p>
            <h3 class="font-bold">バースデーパーティー</h3>
            <p class="text-gray-500 text-sm mt-1">1か月前までにお誕生日をお伝えください。ケーキ代のみ払っていただき、パーティー料理をお作りします。（個別対応あり）</p>
          </div>
        </div>
      </section>

    </main>

    <!-- フッター -->
    <footer class="bg-gray-800 text-gray-400 text-sm text-center py-6">
      &copy; 2026 まちのごはん屋さん
    </footer>

  </body>
</html>
