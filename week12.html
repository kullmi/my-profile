<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="POSSEでプログラミングを学ぶ、くーのポートフォリオです。">
  <title>くーのポートフォリオ</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <header class="bg-indigo-700 px-4 py-12 text-center text-white sm:py-16">
    <p class="mb-3 text-sm font-semibold tracking-[0.2em] text-indigo-200">MY PORTFOLIO</p>
    <h1 class="text-3xl font-bold sm:text-4xl">くーのポートフォリオ</h1>
    <p class="mt-4 text-indigo-100">POSSEでプログラミングを学んでいます</p>
  </header>

  <main class="mx-auto max-w-3xl space-y-16 px-4 py-12 sm:py-16">
    <section aria-labelledby="about-title">
      <h2 id="about-title" class="mb-4 border-l-4 border-indigo-500 pl-3 text-2xl font-bold">自己紹介</h2>
      <p class="leading-8 text-slate-600">
        こんにちは! POSSE最弱です。HTMLやCSSを学びながら、Webサイト制作に取り組んでいます。
        学んだことを活かして、見やすく楽しいページを作れるように頑張っています。
      </p>
    </section>

    <section aria-labelledby="skills-title">
      <h2 id="skills-title" class="mb-5 border-l-4 border-indigo-500 pl-3 text-2xl font-bold">スキル</h2>
      <ul class="flex flex-wrap gap-3">
        <li class="rounded-full bg-indigo-100 px-4 py-2 text-sm font-medium text-indigo-800 transition-all duration-300 hover:-translate-y-1 hover:bg-indigo-200">HTML</li>
        <li class="rounded-full bg-indigo-100 px-4 py-2 text-sm font-medium text-indigo-800 transition-all duration-300 hover:-translate-y-1 hover:bg-indigo-200">CSS</li>
        <li class="rounded-full bg-indigo-100 px-4 py-2 text-sm font-medium text-indigo-800 transition-all duration-300 hover:-translate-y-1 hover:bg-indigo-200">Tailwind CSS</li>
        <li class="rounded-full bg-indigo-100 px-4 py-2 text-sm font-medium text-indigo-800 transition-all duration-300 hover:-translate-y-1 hover:bg-indigo-200">JavaScript</li>
        <li class="rounded-full bg-indigo-100 px-4 py-2 text-sm font-medium text-indigo-800 transition-all duration-300 hover:-translate-y-1 hover:bg-indigo-200">Splide</li>
      </ul>
    </section>

    <section aria-labelledby="works-title">
      <h2 id="works-title" class="mb-5 border-l-4 border-indigo-500 pl-3 text-2xl font-bold">作品</h2>
      <div class="splide" aria-label="作品スライダー">
        <div class="splide__track overflow-hidden rounded-xl">
          <ul class="splide__list">
            <li class="splide__slide">
              <a href="./img/img%20folder/ChatGPT%20Image%20満月のパンケーキ.png"
                 class="group relative block overflow-hidden rounded-xl bg-slate-200"
                 aria-label="満月のパンケーキの画像を見る">
                <img src="./img/img%20folder/ChatGPT%20Image%20満月のパンケーキ.png"
                     alt="満月をイメージしたパンケーキ"
                     class="aspect-video w-full object-cover transition-all duration-300 group-hover:scale-105">
                <span class="absolute inset-0 flex items-center justify-center bg-slate-950/55 text-lg font-bold text-white opacity-0 transition-all duration-300 group-hover:opacity-100 group-focus-visible:opacity-100">
                  詳細を見る
                </span>
              </a>
            </li>
            <li class="splide__slide">
              <a href="./img/img%20folder/ChatGPT%20Image%20星空サイダー.png"
                 class="group relative block overflow-hidden rounded-xl bg-slate-200"
                 aria-label="星空サイダーの画像を見る">
                <img src="./img/img%20folder/ChatGPT%20Image%20星空サイダー.png"
                     alt="星空をイメージしたサイダー"
                     class="aspect-video w-full object-cover transition-all duration-300 group-hover:scale-105">
                <span class="absolute inset-0 flex items-center justify-center bg-slate-950/55 text-lg font-bold text-white opacity-0 transition-all duration-300 group-hover:opacity-100 group-focus-visible:opacity-100">
                  詳細を見る
                </span>
              </a>
            </li>
          </ul>
        </div>
      </div>
      <p class="mt-3 text-sm text-slate-500">画像を左右に操作して作品をご覧ください。</p>
    </section>
  </main>

  <footer class="mt-8 bg-slate-900 px-4 py-6 text-center text-sm text-slate-300">
    <p>&copy; 2026 くー</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
